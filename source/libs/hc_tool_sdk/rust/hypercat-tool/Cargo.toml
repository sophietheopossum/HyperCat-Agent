# SPDX-License-Identifier: Apache-2.0
# Part of the HyperCat Tool SDK (Apache-2.0). A NATIVE-runtime Rust tool: a compiled binary that
# self-confines the strict way via FFI to hc_tool_confine() in the SDK's static lib.
[package]
name = "hypercat-tool"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "HyperCat third-party Tool SDK helper for native Rust tools (bus protocol + strict self-confine via FFI)."

[dependencies]
serde_json = "1"

# The crate FFIs to hc_tool_confine() (and links the SDK's fat static lib, which bundles hc_confine). build.rs
# points the linker at libhc_tool_sdk.a; set HC_TOOL_SDK_LIB_DIR to its directory (the SDK bundle's lib/, or the
# CMake build tree's libs/hc_tool_sdk/). See docs/BUILDING.md.
[build-dependencies]

[[example]]
name = "reverse"
path = "examples/reverse.rs"
